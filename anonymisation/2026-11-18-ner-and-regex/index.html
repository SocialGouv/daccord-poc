<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test anonymisation</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1c2230;
    --muted: #5d667a;
    --border: #cfd4de;
    --accent: #000091;
    --accent-text: #ffffff;
    --ok-bg: #d8f5df;
    --ok-fg: #0b5a1f;
    --ko-bg: #fde0e0;
    --ko-fg: #8c1111;
    --mark-bg: #e3e3fd;
    --mark-fg: #000091;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171f;
      --surface: #1d212c;
      --text: #e6e9f0;
      --muted: #9aa3b8;
      --border: #373e50;
      --accent: #8d8dff;
      --accent-text: #0d0d3a;
      --ok-bg: #12351c;
      --ok-fg: #8fe0a5;
      --ko-bg: #411a1a;
      --ko-fg: #ffb0b0;
      --mark-bg: #2a2a5c;
      --mark-fg: #c9c9ff;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem 0 3rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  main {
    width: 80%;
    margin: 0 auto;
  }

  h1 {
    margin: 0 0 1.25rem;
    font-size: 1.5rem;
  }

  label {
    display: block;
    margin-bottom: .4rem;
    font-weight: 600;
  }

  textarea {
    display: block;
    width: 100%;
    min-height: 40vh;
    padding: .9rem 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: inherit;
    font: inherit;
    resize: vertical;
  }
  textarea:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .actions {
    margin: 1rem 0 1.5rem;
    text-align: center;
  }
  .hint {
    margin: .5rem 0 0;
    color: var(--muted);
    font-size: .85rem;
  }

  button {
    padding: .65rem 2.5rem;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: .6;
    cursor: progress;
  }

  .results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    align-items: start;
  }

  .panel {
    min-width: 0;
    padding: 1rem 1.25rem 1.25rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
  }
  .panel h2 {
    margin: 0 0 .75rem;
    font-size: 1.1rem;
  }
  .panel p { margin: 0 0 .75rem; }

  .muted { color: var(--muted); }
  .small { font-size: .85rem; }

  .verdict {
    display: inline-block;
    padding: .35rem .75rem;
    border-radius: 6px;
    font-weight: 600;
  }
  .verdict.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .verdict.ko { background: var(--ko-bg); color: var(--ko-fg); }

  .error {
    padding: .6rem .8rem;
    border-radius: 6px;
    background: var(--ko-bg);
    color: var(--ko-fg);
  }

  table {
    width: 100%;
    margin-bottom: .75rem;
    border-collapse: collapse;
    font-size: .9rem;
  }
  th, td {
    padding: .35rem .5rem;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
    overflow-wrap: anywhere;
  }
  th { color: var(--muted); font-weight: 600; }

  ul.warnings {
    margin: 0 0 .75rem;
    padding-left: 1.25rem;
    color: var(--muted);
    font-size: .9rem;
  }

  .texte-anonymise {
    max-height: 60vh;
    margin: 0 0 .75rem;
    padding: .75rem .9rem;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  mark {
    padding: 0 .2em;
    border-radius: 3px;
    background: var(--mark-bg);
    color: var(--mark-fg);
    font-weight: 600;
  }

  .compteurs {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    margin: 0 0 .75rem;
    padding: 0;
    list-style: none;
  }
  .compteurs li {
    padding: .1rem .6rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: .85rem;
  }

  @media (max-width: 800px) {
    main { width: 94%; }
    .results { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>Test des services d'anonymisation</h1>

  <label for="texte">Texte à tester</label>
  <textarea id="texte" spellcheck="false" autocomplete="off"
    placeholder="Jean Dupont habite à Lyon. Contact : jean.dupont@example.fr, 06 12 34 56 78."></textarea>

  <div class="actions">
    <button id="valider" type="button">Valider</button>
    <p class="hint">Ctrl + Entrée pour valider</p>
  </div>

  <div class="results">
    <section class="panel" aria-labelledby="titre-verification" aria-live="polite">
      <h2 id="titre-verification">Vérification</h2>
      <div id="verification"><p class="muted">Le résultat apparaîtra ici.</p></div>
    </section>

    <section class="panel" aria-labelledby="titre-anonymisation" aria-live="polite">
      <h2 id="titre-anonymisation">Anonymisation</h2>
      <div id="anonymisation"><p class="muted">Le résultat apparaîtra ici.</p></div>
    </section>
  </div>
</main>

<script>
  // Adresse des services : celle de la page quand elle est servie par l'application (http://localhost:8080/),
  // sinon (fichier ouvert directement) localhost:8080. Surchargeable avec ?api=http://hote:port
  const DEFAULT_API = location.protocol.startsWith("http") ? location.origin : "http://localhost:8080";
  const API = (new URLSearchParams(location.search).get("api") || DEFAULT_API).replace(/\/+$/, "");

  const PLACEHOLDER = /\[[A-Z_]+_\d+\]|\*{2,}/g;

  const KIND_LABELS = {
    RESIDUAL_ENTITY: "Donnée restante",
    ORIGINAL_VALUE_LEAK: "Valeur de l'original",
  };

  const texte = document.getElementById("texte");
  const bouton = document.getElementById("valider");

  // Construit le DOM avec des nœuds texte : le contenu venant du service n'est jamais interprété comme du HTML.
  function el(tag, attributes, ...children) {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attributes || {})) {
      node.setAttribute(name, value);
    }
    node.append(...children);
    return node;
  }

  function show(container, ...nodes) {
    container.replaceChildren(...nodes);
  }

  async function post(path, body) {
    let response;
    try {
      response = await fetch(API + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    } catch (e) {
      // Le navigateur ne distingue pas « service arrêté » de « CORS refusé » ; le CORS n'entre en jeu que si
      // la page n'est pas servie par le service lui-même.
      throw new Error(
        "Service injoignable (" + API + "). " +
        (API === location.origin
          ? "Est-il toujours démarré ?"
          : "Est-il démarré à cette adresse ? Sinon, le CORS n'est peut-être pas autorisé : démarrer le service " +
            "avec --anonymisation.cors.allowed-origins=*."));
    }
    const payload = await response.json().catch(() => null);
    if (!response.ok) {
      throw new Error((payload && (payload.detail || payload.title)) || "Erreur HTTP " + response.status);
    }
    return payload;
  }

  function duree(start) {
    const seconds = (performance.now() - start) / 1000;
    return el("p", { class: "muted small" }, "Durée : " + seconds.toFixed(1).replace(".", ",") + " s");
  }

  function engines(list) {
    return el("p", { class: "muted small" }, "Moteurs : " + (list.length ? list.join(", ") : "aucun"));
  }

  function renderVerification(report) {
    const conforme = report.verdict === "CONFORME";
    const nodes = [
      el("p", {},
        el("span", { class: "verdict " + (conforme ? "ok" : "ko") },
          conforme
            ? "Conforme : aucune donnée personnelle détectée"
            : "Non conforme : " + report.findings.length + " donnée(s) personnelle(s) détectée(s)")),
    ];

    if (report.findings.length > 0) {
      const rows = report.findings.map((finding) =>
        el("tr", {},
          el("td", {}, finding.type, ...(finding.kind === "RESIDUAL_ENTITY" ? [] : [el("br"), el("span", { class: "muted small" }, KIND_LABELS[finding.kind] || finding.kind)])),
          el("td", {}, finding.text),
          el("td", {}, finding.score.toFixed(2)),
          el("td", {}, finding.start + "–" + finding.end)));
      nodes.push(el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Type"), el("th", {}, "Valeur"), el("th", {}, "Score"), el("th", {}, "Position"))),
        el("tbody", {}, ...rows)));
    }

    if (report.warnings.length > 0) {
      nodes.push(el("ul", { class: "warnings" }, ...report.warnings.map((warning) => el("li", {}, warning))));
    }
    nodes.push(engines(report.engines));
    return nodes;
  }

  function renderAnonymisation(result) {
    // Surligne les marqueurs [TYPE_n] pour les repérer dans le texte.
    const parts = [];
    let cursor = 0;
    for (const match of result.text.matchAll(PLACEHOLDER)) {
      parts.push(result.text.slice(cursor, match.index), el("mark", {}, match[0]));
      cursor = match.index + match[0].length;
    }
    parts.push(result.text.slice(cursor));

    const counts = Object.entries(result.replacements);
    const total = counts.reduce((sum, [, count]) => sum + count, 0);

    return [
      el("pre", { class: "texte-anonymise" }, ...parts),
      counts.length > 0
        ? el("ul", { class: "compteurs", "aria-label": "Remplacements par type" },
            ...counts.map(([type, count]) => el("li", {}, type + " × " + count)))
        : el("p", { class: "muted" }, "Aucun remplacement."),
      el("p", { class: "muted small" }, total + " remplacement(s)"),
      engines(result.engines),
    ];
  }

  // Les deux services sont appelés en parallèle ; chaque panneau affiche son propre résultat ou sa propre erreur.
  async function run(container, path, text, render) {
    show(container, el("p", { class: "muted" }, "Analyse en cours…"));
    const start = performance.now();
    try {
      const nodes = render(await post(path, { text }));
      show(container, ...nodes, duree(start));
    } catch (e) {
      show(container, el("p", { class: "error", role: "alert" }, e.message));
    }
  }

  async function valider() {
    if (bouton.disabled) return;
    const text = texte.value;
    if (!text.trim()) {
      texte.focus();
      return;
    }
    bouton.disabled = true;
    try {
      await Promise.all([
        run(document.getElementById("verification"), "/api/verifications/chaine", text, renderVerification),
        run(document.getElementById("anonymisation"), "/api/anonymisations/chaine", text, renderAnonymisation),
      ]);
    } finally {
      bouton.disabled = false;
    }
  }

  bouton.addEventListener("click", valider);
  texte.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      valider();
    }
  });
</script>
</body>
</html>
